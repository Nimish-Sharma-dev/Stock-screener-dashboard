<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z-score screener</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Z-score screener</h1>
    <div id="badges"></div>
  </header>
  <main>
    <p id="title" class="muted">Connecting...</p>
    <div class="scroll">
      <table>
        <thead>
          <tr><th>Symbol</th><th>Close</th><th>Mean 20</th><th>Std 20</th><th>Z</th><th>Src</th><th>Note</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <h2>Events</h2>
    <ul id="events"></ul>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
